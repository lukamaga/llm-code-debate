services:

  ollama:
    image: ollama/ollama:latest
    container_name: debate-ollama
    ports:
      - "127.0.0.1:11434:11434"
      # Web interface of debate-system, which shares this container's network
      - "127.0.0.1:5050:5050"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  debate-system:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: debate-system
    # The application connects to Ollama at http://localhost:11434, so it runs
    # in the network namespace of the ollama service.
    network_mode: "service:ollama"
    # Flask-SocketIO's development server requires an interactive terminal.
    stdin_open: true
    tty: true
    volumes:
      - ./results:/app/results
      - ./tasks:/app/tasks
      - ./debate_results.db:/app/debate_results.db
    depends_on:
      - ollama
    command: python -m src.main --web

volumes:
  ollama_data:
